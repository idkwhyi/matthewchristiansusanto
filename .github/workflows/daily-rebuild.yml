# Rebuild otomatis sekali sehari, supaya perubahan di Google Sheets ikut tayang
# walaupun Anda lupa menekan deploy hook.
# Butuh secret repo bernama DEPLOY_HOOK_URL (Settings > Secrets and variables > Actions).
name: Daily rebuild

on:
  schedule:
    - cron: '17 23 * * *' # 06:17 WIB setiap hari
  workflow_dispatch: # bisa juga dijalankan manual dari tab Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Secret DEPLOY_HOOK_URL belum diisi, lewati."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
